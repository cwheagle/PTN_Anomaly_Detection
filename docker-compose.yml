services:
  zookeeper:
    platform: ${PTN_PLATFORM:-linux/arm64}  # 기본: GPU 서버(arm64). 로컬 x86 테스트는 PTN_PLATFORM=linux/amd64
    image: confluentinc/cp-zookeeper:7.5.0
    hostname: zookeeper
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    platform: ${PTN_PLATFORM:-linux/arm64}  # 기본: GPU 서버(arm64). 로컬 x86 테스트는 PTN_PLATFORM=linux/amd64
    image: confluentinc/cp-kafka:7.5.0
    hostname: kafka
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  redis:
    platform: ${PTN_PLATFORM:-linux/arm64}  # 기본: GPU 서버(arm64). 로컬 x86 테스트는 PTN_PLATFORM=linux/amd64
    image: redis:7.2-alpine
    hostname: redis
    container_name: redis
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning

  api:
    platform: ${PTN_PLATFORM:-linux/arm64}  # 기본: GPU 서버(arm64). 로컬 x86 테스트는 PTN_PLATFORM=linux/amd64
    build:
      context: .
      dockerfile: Dockerfile.api
    #image: 'ptn_anomaly_detection-api:latest'
    container_name: ptn_anomaly_detection-api
    ports:
      - "8000:8000"
    environment:
      - TZ=${PTN_TZ:-Asia/Seoul}   # DB 타임스탬프가 로컬 시각이므로 컨테이너 시간대를 맞춤 (기본 UTC 이면 최근 15분 조회가 9시간 어긋남)
      - DB_HOST=${DB_HOST:-host.docker.internal}
      - DB_USER=${DB_USER:-root}
      - DB_PASS=${DB_PASS:-root}
      - DB_NAME=${DB_NAME:-cowptn_test}
      - DB_PORT=${DB_PORT:-3306}
      - KAFKA_BROKERS=kafka:29092
      - REDIS_HOST=redis
      - ALARM_RENOTIFY_MINUTES=${ALARM_RENOTIFY_MINUTES:-15}   # 지속 중인 CRITICAL 재알림 간격(분). 15=매 스텝, 0=진입 시 1회
      - DRIFT_RETRAIN_MODE=${DRIFT_RETRAIN_MODE:-candidate}    # off(감지만) / candidate(후보 학습+수동 승격) / auto(게이트 통과 시 자동)
    volumes:
      - ptn_models:/app/models
      - ptn_rca_rules:/app/src/rca/rules
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    depends_on:
      - kafka
      - redis

  ui:
    platform: ${PTN_PLATFORM:-linux/arm64}  # 기본: GPU 서버(arm64). 로컬 x86 테스트는 PTN_PLATFORM=linux/amd64
    build:
      context: .
      dockerfile: Dockerfile.ui
    #image: 'ptn_anomaly_detection-ui:latest'
    container_name: ptn_anomaly_detection-ui
    ports:
      - "80:80"
    depends_on:
      - api

  consumer:
    platform: ${PTN_PLATFORM:-linux/arm64}  # 기본: GPU 서버(arm64). 로컬 x86 테스트는 PTN_PLATFORM=linux/amd64
    build:
      context: .
      dockerfile: Dockerfile.consumer
    #image: 'ptn_anomaly_detection-consumer:latest'
    container_name: ptn_anomaly_detection-consumer
    environment:
      - TZ=${PTN_TZ:-Asia/Seoul}   # DB 타임스탬프가 로컬 시각이므로 컨테이너 시간대를 맞춤 (기본 UTC 이면 최근 15분 조회가 9시간 어긋남)
      - DB_HOST=${DB_HOST:-host.docker.internal}
      - DB_USER=${DB_USER:-root}
      - DB_PASS=${DB_PASS:-root}
      - DB_NAME=${DB_NAME:-cowptn_test}
      - DB_PORT=${DB_PORT:-3306}
      - KAFKA_BROKERS=kafka:29092
      - REDIS_HOST=redis
      - API_URL=http://api:8000
    volumes:
      - ptn_models:/app/models
      - ptn_rca_rules:/app/src/rca/rules
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    depends_on:
      - kafka
      - redis
      - api

  producer:
    platform: ${PTN_PLATFORM:-linux/arm64}  # 기본: GPU 서버(arm64). 로컬 x86 테스트는 PTN_PLATFORM=linux/amd64
    build:
      context: .
      dockerfile: Dockerfile.producer
    #image: 'ptn_anomaly_detection-producer:latest'
    container_name: ptn_anomaly_detection-producer
    environment:
      - TZ=${PTN_TZ:-Asia/Seoul}   # DB 타임스탬프가 로컬 시각이므로 컨테이너 시간대를 맞춤 (기본 UTC 이면 최근 15분 조회가 9시간 어긋남)
      - DB_HOST=${DB_HOST:-host.docker.internal}
      - DB_USER=${DB_USER:-root}
      - DB_PASS=${DB_PASS:-root}
      - DB_NAME=${DB_NAME:-cowptn_test}
      - DB_PORT=${DB_PORT:-3306}
      - KAFKA_BROKERS=kafka:29092
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    depends_on:
      - kafka

volumes:
  ptn_models: # api(학습) -> consumer(추론) 간 모델 파일 공유
  ptn_rca_rules: # api(룰 편집) -> consumer(RCA) 간 룰 파일 공유
